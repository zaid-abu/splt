name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck E2E boundary
        run: npm run typecheck:e2e

      - name: Typecheck Supabase functions
        run: npm run typecheck:supabase

      - name: Lint
        run: npm run lint -- --quiet

      - name: Format Check
        run: npm run format:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm run test -- --runInBand

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start local Supabase
        run: npx supabase@latest start

      - name: Run pgTAP database tests
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: npx supabase@latest stop
